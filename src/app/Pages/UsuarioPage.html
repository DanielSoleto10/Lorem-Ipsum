<ion-header>
    <ion-toolbar>
      <ion-title>Usuarios</ion-title>
    </ion-toolbar>
  </ion-header>
  
  <ion-content>
    <ion-button (click)="guardarUsuario()">Guardar usuario</ion-button>
    <ion-button (click)="cargarUsuarios()">Cargar usuarios</ion-button>
  
    <ion-list>
      <ion-item *ngFor="let usuario of usuarios">
        {{ usuario.nombre }} - {{ usuario.correo }}
      </ion-item>
    </ion-list>
  </ion-content>
