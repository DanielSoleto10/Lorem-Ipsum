<ion-header>
  <ion-toolbar color="light">
    <ion-title>Detalles de Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="perfil-content">
  <div class="perfil-card">
    <img class="perfil-foto" src="assets/icon/cuenta.png" alt="Foto Perfil" />

    <h2 class="perfil-nombre">{{ usuario?.nombres }} {{ usuario?.apellidos }}</h2>
    <p class="perfil-rol">Agricultor</p>

    <div class="perfil-dato">
      <label>Correo Electrónico</label>
      <p>{{ usuario?.correo }}</p>
    </div>

    <div class="perfil-botones">
      <button class="editar">Editar Perfil</button>
      <button class="cerrar" (click)="logout()">Cerrar Sesión</button>
    </div>
  </div>
</ion-content>
<app-footer></app-footer>
