<ion-content>
  <ion-card>
    <ion-card-header>
      <ion-card-title>Recuperar Contraseña</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
        <ion-item>
          <ion-label position="floating">Correo</ion-label>
          <ion-input
            type="email"
            formControlName="correo"
            required>
          </ion-input>
        </ion-item>

        <div class="error-msg" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <ion-button expand="block" type="submit" [disabled]="!forgotForm.valid">
          Recuperar
        </ion-button>
      </form>
    </ion-card-content>
  </ion-card>
</ion-content>
